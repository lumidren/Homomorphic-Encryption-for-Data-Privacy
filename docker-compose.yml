# Full production-like stack on one machine:
#   cp .env.example .env && ./scripts/gen-dev-certs.sh && docker compose up --build
# API:       https://localhost:8443          (TLS 1.3, optional mTLS)
# Dashboard: https://app.localhost:8443
# Grafana:   http://localhost:3001  (profile "observability")
#
# For development without Docker, use scripts/devstack.py instead.

name: ciphercompute

x-backend-env: &backend-env
  # Composite URLs live here (not in .env) so compose interpolates the passwords reliably.
  CC_DATABASE_URL: postgresql+asyncpg://ciphercompute:${POSTGRES_PASSWORD}@postgres:5432/ciphercompute
  CC_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CC_S3_ENDPOINT_URL: http://minio:9000
  CC_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  CC_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

x-python-service: &python-service
  image: ciphercompute-python:${CC_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  env_file: .env
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ciphercompute
      POSTGRES_USER: ciphercompute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphercompute -d ciphercompute"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY in .env}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *python-service
    environment: { <<: *backend-env, SERVICE: migrate }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *python-service
    environment:
      <<: *backend-env
      SERVICE: api
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    stop_grace_period: 35s

  worker:
    <<: *python-service
    environment: { <<: *backend-env, SERVICE: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy:
      replicas: 2
    stop_grace_period: 11m

  dashboard:
    image: ciphercompute-dashboard:${CC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    environment:
      CC_API_URL: http://api:8000
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports: ["8080:8080", "8443:8443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/mtls-policy.conf:/etc/nginx/conf.d/mtls-policy.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: [api, dashboard]
    restart: unless-stopped

  # ----- observability (docker compose --profile observability up) -------------------------
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otel/config.yaml:ro"]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  pgdata:
  redisdata:
  miniodata:
