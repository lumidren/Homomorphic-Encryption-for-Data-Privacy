name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish, so every pushed commit gets a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Upstream MinIO images are no longer published; Chainguard's build, pinned by digest.
  MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714

jobs:
  lint-python:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e packages/core -e "services/api[test]" -e "services/worker[test]" -e "packages/client[test]" ruff mypy
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy packages/core/src packages/client/src services/api/src services/worker/src
      - name: Threat-model references are exact
        run: .venv/bin/python scripts/resolve_threat_refs.py --check
      - name: Grafana dashboard JSON matches its source
        run: .venv/bin/python scripts/build_grafana_dashboard.py --check

  test-core:
    name: Crypto core (property + depth tests, 100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e "packages/core[test]"
      - name: All N=8192 and N=16384 presets
        working-directory: packages/core
        env:
          CC_PROPERTY_EXAMPLES: "15"
        # One process per N=16384 set: SEAL's memory pool never shrinks, so a single process holding
        # every large key ring runs out of memory. Coverage is merged and gated at 100% at the end.
        run: ../../.venv/bin/python scripts/run_suite.py && ../../.venv/bin/python -m coverage xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage-core, path: packages/core/coverage.xml }

  test-core-heavy:
    name: Crypto core, N=32768 presets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e "packages/core[test]"
      - working-directory: packages/core
        env:
          CC_TEST_HEAVY: "1"
          CC_PROPERTY_EXAMPLES: "5"
        run: ../../.venv/bin/pytest -m heavy tests/test_properties.py tests/test_depth_regression.py

  test-services:
    name: API, worker and SDK (>= 90% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e packages/core -e "services/api[test]" -e "services/worker[test]" -e "packages/client[test]"
      - working-directory: services/api
        run: ../../.venv/bin/pytest --cov=ciphercompute_api --cov-report=xml
      - working-directory: services/worker
        run: ../../.venv/bin/pytest --cov=ciphercompute_worker --cov-report=xml
      - working-directory: packages/client
        run: ../../.venv/bin/pytest --cov=ciphercompute_client --cov-report=xml
      - working-directory: infra
        run: ../.venv/bin/pytest tests

  integration:
    name: Integration (PostgreSQL 16, Redis 7, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_DB: ciphercompute, POSTGRES_USER: ciphercompute, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ciphercompute" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --tmpfs /data:rw,uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=ci -e MINIO_ROOT_PASSWORD=ci-only-password \
            -e MINIO_KMS_SECRET_KEY=ci-key:$(openssl rand -base64 32) "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e packages/core -e "services/api[test]" -e "services/worker[test]" -e "packages/client[test]"
      - name: Migrations against PostgreSQL (upgrade, drift check, downgrade, upgrade)
        working-directory: services/api
        env:
          CC_DATABASE_URL: postgresql+asyncpg://ciphercompute:ci-only-password@127.0.0.1:5432/ciphercompute
          CC_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes-xx
        run: |
          ../../.venv/bin/alembic -c alembic.ini upgrade head
          ../../.venv/bin/alembic -c alembic.ini check
          ../../.venv/bin/alembic -c alembic.ini downgrade base
          ../../.venv/bin/alembic -c alembic.ini upgrade head
      - name: End-to-end against real services
        env:
          CC_IT_DATABASE_URL: postgresql+asyncpg://ciphercompute:ci-only-password@127.0.0.1:5432/ciphercompute
          CC_IT_REDIS_URL: redis://127.0.0.1:6379/0
          CC_IT_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: ci
          AWS_SECRET_ACCESS_KEY: ci-only-password
        run: .venv/bin/pytest tests/integration -v

  backup-restore-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_DB: ciphercompute, POSTGRES_USER: ciphercompute, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ciphercompute" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --tmpfs /data:rw,uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=ci -e MINIO_ROOT_PASSWORD=ci-only-password "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e packages/core -e "services/api[test]" awscli
      - name: Seed, back up, destroy, restore, verify
        env:
          PGPASSWORD: ci-only-password
          AWS_ACCESS_KEY_ID: ci
          AWS_SECRET_ACCESS_KEY: ci-only-password
        run: PATH="$PWD/.venv/bin:$PATH" ./scripts/restore_drill.sh

  dashboard:
    name: Dashboard (tsc, eslint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  lighthouse:
    name: Lighthouse (performance, accessibility, best practices >= 0.95)
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci && npm run build
        working-directory: dashboard
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=dashboard/lighthouserc.json

  security:
    name: Dependency audit and SAST (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e packages/core -e services/api -e services/worker -e packages/client pip-audit bandit semgrep
      - name: pip-audit
        run: .venv/bin/pip-audit --skip-editable  # our own packages are editable; every third-party dependency is audited
      - name: Bandit (HIGH severity fails)
        run: .venv/bin/bandit -r packages/core/src packages/client/src services/api/src services/worker/src --severity-level high --confidence-level medium
      - name: Semgrep (OWASP Top 10 + Python + project rules)
        run: .venv/bin/semgrep scan --config p/owasp-top-ten --config p/python --config p/secrets --config .semgrep --severity ERROR --error
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: npm audit
        working-directory: dashboard
        run: npm ci && npm audit --audit-level=high

  containers:
    name: Build images and scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint-python, test-core, test-services, dashboard, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker build -f infra/docker/python.Dockerfile -t ghcr.io/lumidren/ciphercompute-python:sha-${GITHUB_SHA::12} .
          docker build -f infra/docker/dashboard.Dockerfile -t ghcr.io/lumidren/ciphercompute-dashboard:sha-${GITHUB_SHA::12} .
      - name: Trivy image scan (HIGH/CRITICAL fail the build)
        run: |
          for image in ciphercompute-python ciphercompute-dashboard; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/lumidren/${image}:sha-${GITHUB_SHA::12}"
          done
      - name: Trivy config scan (Dockerfiles, Helm, Terraform)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.66.0 config --severity HIGH,CRITICAL --exit-code 1 /src/infra
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/lumidren/ciphercompute-python:sha-${GITHUB_SHA::12}
          docker push ghcr.io/lumidren/ciphercompute-dashboard:sha-${GITHUB_SHA::12}

  infra:
    name: Helm and Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.18.4 }
      - name: helm lint + render + kubeconform
        run: |
          helm lint infra/helm/ciphercompute -f infra/helm/ciphercompute/values-prod.yaml
          helm template cc infra/helm/ciphercompute -f infra/helm/ciphercompute/values-prod.yaml > rendered.yaml
          # kubeconform release binary, verified against its published checksum (no container pull).
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }
      - name: terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: terraform plan (needs the AWS deploy role)
        if: github.event_name == 'push' && vars.AWS_PLAN_ROLE_ARN != ''
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          echo "Configure OIDC credentials for ${{ vars.AWS_PLAN_ROLE_ARN }} and run:"
          echo "terraform init -backend-config=backend.hcl && terraform plan -var-file=staging.tfvars -lock=false"
