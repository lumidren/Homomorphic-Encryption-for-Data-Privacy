# Alert rules. Each alert names its RUNBOOK.md section in the runbook annotation.
groups:
  - name: ciphercompute-api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(ciphercompute_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(ciphercompute_http_requests_total[5m])), 1e-9) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "API 5xx rate above 2% for 5 minutes"
          runbook: "RUNBOOK.md#api-high-error-rate"
      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ciphercompute_http_request_duration_seconds_bucket{route!~".*/key-bundles|.*/events"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "API p95 latency above 1s (excluding uploads and event streams)"
          runbook: "RUNBOOK.md#api-latency-high"
      - alert: ApiDown
        expr: up{job="ciphercompute-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "An API instance is not being scraped"
          runbook: "RUNBOOK.md#api-down"
      - alert: AuditChainBroken
        expr: min(ciphercompute_audit_chain_valid) == 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "An organization's audit hash chain failed verification — possible tampering"
          runbook: "RUNBOOK.md#audit-chain-broken"

  - name: ciphercompute-queue
    rules:
      - alert: QueueDepthHigh
        expr: ciphercompute_queue_depth > 200
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "More than 200 jobs queued for 10 minutes"
          runbook: "RUNBOOK.md#queue-depth-high"
      - alert: WorkerStarvation
        # Jobs are waiting but no worker is executing anything.
        expr: ciphercompute_queue_depth > 0 and on() (sum(ciphercompute_worker_busy) or vector(0)) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Jobs are queued but no worker has been busy for 5 minutes"
          runbook: "RUNBOOK.md#worker-starvation"
      - alert: WorkersDown
        expr: absent(up{job="ciphercompute-worker"} == 1)
        for: 3m
        labels: { severity: page }
        annotations:
          summary: "No worker is being scraped"
          runbook: "RUNBOOK.md#worker-starvation"
      - alert: JobFailureRateHigh
        expr: |
          sum(rate(ciphercompute_jobs_finished_total{status="failed"}[15m]))
            / clamp_min(sum(rate(ciphercompute_jobs_finished_total[15m])), 1e-9) > 0.1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "More than 10% of jobs failing"
          runbook: "RUNBOOK.md#job-failures"
      - alert: TenantThrottledPersistently
        expr: sum by (organization) (rate(ciphercompute_tenant_throttled_total[15m])) > 1
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Organization {{ $labels.organization }} is persistently at its concurrency limit"
          runbook: "RUNBOOK.md#tenant-throttled"
