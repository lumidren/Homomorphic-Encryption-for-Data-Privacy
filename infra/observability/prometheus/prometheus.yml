global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ciphercompute-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: ciphercompute-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
