{{- if .Values.migrations.enabled }}
# Runs `alembic upgrade head` before every install/upgrade; the release proceeds only if it succeeds.
# Migrations must be backward compatible with the previous release (expand/contract) so the
# rolling update can run old and new pods side by side.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cc.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "cc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ciphercompute
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "cc.name" . }}
      securityContext: {{- include "cc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "cc.image" (dict "root" . "image" .Values.image.python) }}
          env:
            - { name: SERVICE, value: migrate }
          envFrom: {{- include "cc.envFrom" . | nindent 12 }}
          securityContext: {{- include "cc.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
