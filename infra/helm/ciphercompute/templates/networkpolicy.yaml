{{- if .Values.networkPolicy.enabled }}
# [TM:E-3] Default deny for every CipherCompute pod, then explicit allows. A compromised
# dashboard pod cannot reach the database; a compromised worker cannot be reached from outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-default-deny
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ciphercompute
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-dns
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-api
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cc.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }} }
        - podSelector:
            matchLabels: {{- include "cc.selector" (dict "root" . "component" "dashboard") | nindent 14 }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
  egress:
    - to:
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-worker
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cc.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: {{ .Values.worker.metricsPort }} }
  egress:
    - to:
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-dashboard
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cc.selector" (dict "root" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }} }
      ports:
        - { protocol: TCP, port: {{ .Values.dashboard.port }} }
  egress:
    # The dashboard talks only to the API service — never to the database or object storage.
    - to:
        - podSelector:
            matchLabels: {{- include "cc.selector" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-migrate
  labels: {{- include "cc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: migrate
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
