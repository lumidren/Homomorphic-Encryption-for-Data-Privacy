# CipherCompute edge proxy.
#
# * TLS 1.3 only (TM:S-4, TM:T-4); HSTS; no plaintext listener except a redirect.
# * Optional mutual TLS for SDK/CLI clients on api.* (ssl_verify_client optional + per-location
#   enforcement), using the client CA in /etc/nginx/certs/client-ca.pem.
# * Bundle uploads may be large (public bundles are tens to hundreds of MB); everything else is small.
# * Server-Sent Events stream unbuffered.
# * /metrics is never exposed publicly.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"request_id":"$request_id","tls":"$ssl_protocol","client_cert":"$ssl_client_verify"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # [TM:D-3] Coarse per-IP limit at the edge; the API applies per-key limits behind it.
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;
  ssl_certificate /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server-key.pem;
  ssl_client_certificate /etc/nginx/certs/client-ca.pem;
  ssl_verify_client optional;

  upstream api {
    server api:8000;
    keepalive 32;
  }

  upstream dashboard {
    server dashboard:3000;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;
    return 308 https://$host$request_uri;
  }

  # ----- API ---------------------------------------------------------------------------------
  server {
    listen 8443 ssl;
    http2 on;
    server_name api.* localhost;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $request_id always;

    client_max_body_size 1m;
    limit_req zone=per_ip burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Client-Cert-Verify $ssl_client_verify;

    # Mutual TLS is enforced when the deployment sets $require_client_cert (see include file);
    # by default clients may authenticate with a certificate *or* fall back to tokens/API keys.
    include /etc/nginx/conf.d/mtls-policy.conf;

    location = /metrics { return 404; }

    location ~ ^/v1/projects/[^/]+/key-bundles$ {
      client_max_body_size 1g;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://api;
    }

    location ~ ^/v1/jobs/[^/]+/events$ {
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
      proxy_pass http://api;
    }

    location / {
      proxy_read_timeout 120s;
      proxy_pass http://api;
    }
  }

  # ----- Dashboard -----------------------------------------------------------------------------
  server {
    listen 8443 ssl;
    http2 on;
    server_name app.* dashboard.*;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 1m;
    limit_req zone=per_ip burst=120 nodelay;

    location ~ ^/api/proxy/v1/jobs/[^/]+/events$ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_pass http://dashboard;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://dashboard;
    }
  }
}
