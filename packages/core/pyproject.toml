[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciphercompute-core"
version = "0.1.0"
description = "CKKS crypto core for CipherCompute: parameter validation, public/secret key split, encrypted vectors, homomorphic operations and multiplicative-depth budgeting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "lumidren" }]
keywords = ["homomorphic-encryption", "ckks", "seal", "tenseal", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "tenseal>=0.3.16,<0.4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/lumidren/Homomorphic-Encryption-for-Data-Privacy"

[tool.hatch.build.targets.wheel]
packages = ["src/ciphercompute_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "heavy: parameter sets that need several GB of RAM and minutes of CPU (N=32768); enabled with CC_TEST_HEAVY=1",
]

[tool.coverage.run]
source = ["ciphercompute_core"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
