[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciphercompute-client"
version = "0.1.0"
description = "Client SDK and CLI for CipherCompute: generate CKKS keys locally, encrypt, upload, compute on ciphertexts server-side, decrypt locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "lumidren" }]
keywords = ["homomorphic-encryption", "ckks", "privacy", "sdk", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "ciphercompute-core==0.1.0",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "python-multipart>=0.0.9",
  "ciphercompute-api[test]==0.1.0",
  "ciphercompute-worker==0.1.0",
]

[project.scripts]
ciphercompute = "ciphercompute_client.cli:main"

[project.urls]
Homepage = "https://github.com/lumidren/Homomorphic-Encryption-for-Data-Privacy"

[tool.hatch.build.targets.wheel]
packages = ["src/ciphercompute_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ciphercompute_client"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
