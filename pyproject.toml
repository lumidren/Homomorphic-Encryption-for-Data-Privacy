# Repository-wide tool configuration. The installable packages live in packages/* and
# services/*, each with its own pyproject.toml.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/core/src", "packages/client/src", "services/api/src", "services/worker/src"]
extend-exclude = ["dashboard", "infra", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PIE", "T20"]
ignore = [
  "RUF012",  # mutable class attributes are fine for pydantic/SQLAlchemy declarations
  "E731",    # lambda assignments in the ops registry are deliberate
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "S311", "T20", "E501"]
"**/scripts/**" = ["T20", "S603", "S607"]
"showcase/**" = ["T20"]
"scripts/**" = ["T20"]
"benchmarks/**" = ["T20", "E501"]  # report-table f-strings
"loadtest/**" = ["T20", "S311"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in defaults are evaluated once by design.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path",
  "ciphercompute_api.deps.require",
]

[tool.ruff.lint.isort]
known-first-party = ["ciphercompute_core", "ciphercompute_client", "ciphercompute_api", "ciphercompute_worker"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "packages/core/src:packages/client/src:services/api/src:services/worker/src"
plugins = []

[[tool.mypy.overrides]]
module = ["tenseal", "tenseal.*", "boto3", "boto3.*", "botocore", "botocore.*", "celery", "celery.*", "moto", "moto.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery and its OpenTelemetry instrumentation ship without type information.
module = ["ciphercompute_worker.celery_app", "ciphercompute_worker.tasks", "ciphercompute_api.queue"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
