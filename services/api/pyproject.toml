[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciphercompute-api"
version = "0.1.0"
description = "CipherCompute API: multi-tenant job intake, auth, audit and storage for CKKS workloads. Holds public keys only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "lumidren" }]
dependencies = [
  "ciphercompute-core==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7,<3",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
  "redis>=5.0",
  "boto3>=1.34",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-instrumentation-redis>=0.46b0",
  "opentelemetry-instrumentation-celery>=0.46b0",
  "celery[redis]>=5.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "fakeredis>=2.23",
  "moto[s3]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ciphercompute_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["ciphercompute_api"]
concurrency = ["greenlet", "thread"]
branch = true
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
