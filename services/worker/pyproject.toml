[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciphercompute-worker"
version = "0.1.0"
description = "CipherCompute worker: executes homomorphic operations on CKKS ciphertexts with public keys only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "lumidren" }]
dependencies = [
  "ciphercompute-core==0.1.0",
  "ciphercompute-api==0.1.0",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "opentelemetry-instrumentation-celery>=0.46b0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "aiosqlite>=0.20",
  "fakeredis>=2.23",
  "moto[s3]>=5.0",
]

[project.scripts]
ciphercompute-worker = "ciphercompute_worker.celery_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ciphercompute_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ciphercompute_worker"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
